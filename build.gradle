plugins {
    id 'java'
}

group = 'education'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

allprojects {
    tasks.withType(Test) {
        outputs.upToDateWhen { false }
        testLogging {
            events = ["passed", "skipped", "failed"]
            exceptionFormat = "full"
            showExceptions = true
            showCauses = true
            showStackTraces = true
            showStandardStreams = true
            displayGranularity = 2
        }
        exclude 'ai/local-llm/**'
    }
}

test {
    useJUnitPlatform()
    dependsOn(':java:common:test')
    dependsOn(':java:yaml:test')
    dependsOn(':java:syntax:test')
    dependsOn(':java:jackson:test')
    dependsOn(':java:maths:test')
    dependsOn(':java:vertx:test')
    dependsOn(':java:websockets:infrastructure:test')
    dependsOn(':java:websockets:testing:integration:test')
    dependsOn(':java:websockets:websockets-vertx:test')
    dependsOn(':advent-of-code:2025:test')
}