plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation      fileTree(dir: '../..', include: ['**/*.jar'])
}

shadowJar {
    archiveClassifier.set('')         // output: my-app.jar (not my-app-all.jar)
    mergeServiceFiles()

    relocate 'education', 'education.shaded'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
}
