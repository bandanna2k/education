plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integration-test/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation          "io.vertx:vertx-core:5.0.12"
    implementation          "io.vertx:vertx-web:5.0.12"
    implementation          "io.vertx:vertx-openapi:5.0.12"

    // Dependencies required by openapi-generator jaxrs-spec models
    implementation          'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation          'io.swagger.core.v3:swagger-annotations:2.2.49'
    implementation          'io.swagger.core.v3:swagger-core:2.2.49'
    implementation          'io.swagger.core.v3:swagger-models:2.2.49'
    implementation          'io.swagger.core.v3:swagger-jaxrs2:2.2.49'
    implementation          'javax.ws.rs:javax.ws.rs-api:2.1.1'
    implementation          'javax.validation:validation-api:2.0.1.Final'
    implementation          'javax.annotation:javax.annotation-api:1.3.2'
    implementation          'org.slf4j:slf4j-simple:1.7.36'
    implementation          project(':java:common')

    testImplementation      platform('org.junit:junit-bom:5.10.0')
    testImplementation      'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly         'org.junit.platform:junit-platform-launcher'
    testImplementation      'io.vertx:vertx-web-client:5.0.12'
    testImplementation      'org.assertj:assertj-core:3.27.7'
    testImplementation      'org.mockito:mockito-core:5.23.0'
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

tasks.register('generateSpec', JavaExec) {
    group = 'openapi'
    description = 'Generates OpenAPI spec.yaml from Swagger annotations'
    mainClass = 'education.openapi.codefirst.SpecGenerator'
    classpath = sourceSets.main.runtimeClasspath
    dependsOn 'classes'
}
