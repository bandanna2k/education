plugins {
    id 'java'
    id 'idea'
    id 'org.openapi.generator' version '7.5.0'
}

def generatedRoot = "$projectDir/generated"
def generatedJava = "$generatedRoot/src/gen/java"

repositories {
    mavenCentral()
}

dependencies {
    implementation          "io.vertx:vertx-core:5.0.12"
    implementation          "io.vertx:vertx-web:5.0.12"

    // Dependencies required by openapi-generator jaxrs-spec models
    implementation          'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    compileOnly             'javax.ws.rs:javax.ws.rs-api:2.1.1'
    compileOnly             'javax.validation:validation-api:2.0.1.Final'
    compileOnly             'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation      platform('org.junit:junit-bom:5.10.0')
    testImplementation      'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly         'org.junit.platform:junit-platform-launcher'
    testImplementation      "io.vertx:vertx-web-client:5.0.12"
    testImplementation      'org.assertj:assertj-core:3.27.7'
}

openApiGenerate {
    generatorName           = 'jaxrs-spec'
    inputSpec               = "$projectDir/src/main/resources/spec.yaml"
    outputDir               = generatedRoot
    apiPackage              = 'education.openapi.specfirst.generated.api'
    modelPackage            = 'education.openapi.specfirst.generated.model'
    invokerPackage          = 'education.openapi.specfirst.generated'
    generateApiTests        = false
    generateModelTests      = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions           = [
        interfaceOnly               : 'true',
        returnResponse              : 'false',
        useSwaggerAnnotations       : 'false',
        dateLibrary                 : 'java8',
        hideGenerationTimestamp     : 'true'
    ]
    cleanupOutput           = true
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', generatedJava]
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

idea {
    module {
        generatedSourceDirs += file(generatedJava)
    }
}

tasks.named('compileJava') {
    dependsOn tasks.openApiGenerate
}

tasks.named('compileTestJava') {
    dependsOn tasks.openApiGenerate
}

test {
    useJUnitPlatform()
}