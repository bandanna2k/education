plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation      platform('org.junit:junit-bom:5.10.0')
    testImplementation      'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly         'org.junit.platform:junit-platform-launcher'


    implementation          'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation          'io.vertx:vertx-core:5.0.5'
    implementation          'io.vertx:vertx-web-client:5.0.5'
    implementation          'org.slf4j:slf4j-simple:2.0.17'
    implementation          project(':java:common')
    implementation          project(':java:websockets:client')
    implementation          project(':java:websockets:infrastructure')
    implementation          project(':java:websockets:server')
    implementation          project(':java:websockets:websockets-vertx')

    testImplementation      'com.lmax:simple-dsl:3.0.0'
    testImplementation      'org.awaitility:awaitility:4.3.0'
    testImplementation      'org.junit.jupiter:junit-jupiter-params:5.11.0'
    testImplementation      'org.assertj:assertj-core:3.27.7'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['testResources']
        }
    }
}